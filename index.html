<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savannah Threads</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}

header{background:#000;color:#fff;padding:15px;text-align:center}

.products{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:20px}

.card{background:#fff;padding:15px;width:220px;text-align:center;border-radius:6px}

button{padding:10px;background:#000;color:#fff;border:none;cursor:pointer;margin-top:10px}

.cart{
position:fixed;
top:0;
right:0;
width:300px;
height:100%;
background:#fff;
border-left:2px solid #000;
padding:15px;
overflow:auto;
}

.cart h3{text-align:center}

.cart-item{display:flex;justify-content:space-between;margin:10px 0}

.checkout{margin-top:20px}

input{width:100%;padding:8px;margin:5px 0}

.whatsapp-btn{
background:green;
color:#fff;
width:100%;
padding:12px;
margin-top:10px;
border:none;
}
</style>
</head>

<body>

<header>
<h2>Savannah Threads</h2>
</header>

<!-- PRODUCTS -->
<div class="products">

<div class="card">
<h4>Chrisbella Handbag</h4>
<p>TZS 85000</p>
<button onclick="addToCart('Chrisbella Handbag',85000)">Add to Cart</button>
</div>

<div class="card">
<h4>Minimal T-Shirt</h4>
<p>TZS 25000</p>
<button onclick="addToCart('T-Shirt',25000)">Add to Cart</button>
</div>

<div class="card">
<h4>Sunglasses</h4>
<p>TZS 40000</p>
<button onclick="addToCart('Sunglasses',40000)">Add to Cart</button>
</div>

<div class="card">
<h4>Watch</h4>
<p>TZS 120000</p>
<button onclick="addToCart('Watch',120000)">Add to Cart</button>
</div>

</div>

<!-- CART -->
<div class="cart">
<h3>Your Cart</h3>
<div id="cart-items"></div>
<h4>Total: TZS <span id="total">0</span></h4>

<div class="checkout">
<h4>Checkout</h4>
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="location" placeholder="Location">

<button class="whatsapp-btn" onclick="checkout()">Order via WhatsApp</button>
</div>
</div>

<script>

let cart = [];

function addToCart(name, price){
cart.push({name, price});
renderCart();
}

function renderCart(){
let cartItems = document.getElementById("cart-items");
let total = 0;
cartItems.innerHTML = "";

cart.forEach((item, index)=>{
total += item.price;

cartItems.innerHTML += `
<div class="cart-item">
${item.name} - ${item.price}
<button onclick="removeItem(${index})">x</button>
</div>
`;
});

document.getElementById("total").innerText = total;
}

function removeItem(index){
cart.splice(index,1);
renderCart();
}

function checkout(){
let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let location = document.getElementById("location").value;

if(!name || !phone || !location){
alert("Please fill all details");
return;
}

let message = "New Order:%0A";

cart.forEach(item=>{
message += `${item.name} - TZS ${item.price}%0A`;
});

message += `%0ATotal: TZS ${document.getElementById("total").innerText}`;
message += `%0AName: ${name}`;
message += `%0APhone: ${phone}`;
message += `%0ALocation: ${location}`;

window.open(`https://wa.me/255769715715?text=${message}`);
}

</script>

</body>
</html>
